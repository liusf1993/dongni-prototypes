<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能批改审核原型</title>
<style>
/* 单一浅色主题：贴合现有产品（Element UI + 懂你青绿主色）。布局沿用现有智能批改页：页头横幅 → 题号筛选 → 吸顶工具条 → 左侧分组树 + 右侧卡片网格 → 底部批量条 */
:root{
  --brand:#00a6ab; --brand-dark:#007a7e; --brand-bg:#effafb; --brand-bg2:#f0fdfa;
  --text:#212123; --text2:#606266; --muted:#909399; --border:#e4e7ed; --border2:#dcdfe6; --page:#f4f6f8; --white:#ffffff;
  --red:#f56c6c; --red-bg:#fef0f0; --ok:#24955d; --ok-bg:#e9f6ef; --warn:#d48806; --warn-bg:#fdf6ec;
  --new:#7c4dff; --new-bg:#f3efff;
  --ink:#1b2a6b; --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--page);color:var(--text);font-family:var(--ui);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.tabs button{border:0;background:none;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand-dark);border-color:var(--brand);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border:2px dashed var(--new);border-radius:3px;vertical-align:-1px;margin-right:4px}
.isnew{outline:2px dashed var(--new);outline-offset:3px;border-radius:6px}
.legend-off .isnew{outline:0}

/* 页头 + 筛选（现有） */
.top{background:var(--white);border-radius:10px;overflow:hidden}
.hero{height:88px;background:linear-gradient(100deg,#0e6f6a 0%,#14958a 55%,#3fb59d 100%);display:flex;align-items:flex-start;justify-content:space-between;padding:16px 32px}
.hero .t{display:flex;align-items:center;gap:12px;color:#fff;font-size:24px;font-weight:700;letter-spacing:.04em}
.hero .ico{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:18px}
.hero .btn{background:#fff;color:var(--brand-dark);border:0;border-radius:8px;padding:8px 18px;font-weight:600}
.filters{padding:16px 32px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:40px}
.frow .lb{font-weight:600;width:40px}
.frow .gl{color:var(--muted)}
.qopt{border:0;background:none;height:32px;padding:0 8px;border-radius:6px;color:var(--text);display:inline-flex;align-items:center;gap:4px;position:relative}
.qopt.on{background:var(--brand-bg);color:var(--brand-dark);font-weight:600}
.qopt .dot{min-width:18px;height:16px;padding:0 5px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:11px;line-height:16px;font-weight:500}
.qopt .dot.done{background:var(--ok-bg);color:var(--ok)}
.tr-btns{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.ebtn{border:1px solid var(--border2);background:var(--white);color:var(--text2);border-radius:6px;padding:7px 15px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ebtn:hover{color:var(--brand);border-color:#b3e4e5;background:var(--brand-bg)}
.ebtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.ebtn.primary:hover{background:#13b3b8}
.ebtn.text{border-color:transparent;background:none;color:var(--brand)}
.ebtn.red{color:var(--red);border-color:#fbc4c4;background:var(--red-bg)}
.ebtn[disabled]{opacity:.5;cursor:not-allowed}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border2);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--text2)}
.sw{width:36px;height:20px;border-radius:10px;border:0;background:#dcdfe6;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{left:18px}

/* 主体 */
.main{background:var(--white);border-radius:10px;padding:0 32px 24px}
.toolbar{position:sticky;top:0;z-index:15;background:var(--white);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;flex-wrap:wrap;border-bottom:1px solid transparent}
.toolbar.stuck{border-color:var(--border)}
.tl{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.finish{display:flex;align-items:center;gap:10px;background:linear-gradient(270deg,rgba(255,255,255,0) 0%,rgba(36,149,93,.08) 38%);border-left:3px solid var(--brand);padding:8px 14px 8px 20px;font-size:16px;color:var(--brand-dark);font-weight:600}
.refresh{border:0;border-radius:6px;background:linear-gradient(90deg,#14958a,#3fb59d);color:#fff;font-size:13px;padding:3px 10px}
.rv{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.rv .bar{width:120px;height:6px;border-radius:3px;background:#ebeef5;overflow:hidden;display:flex}
.rv .bar i{display:block;height:100%}
.rv .bar .r{background:var(--ok)} .rv .bar .c{background:var(--warn)}
.rv b{color:var(--text)}
.rg{display:inline-flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.rg button{border:0;background:var(--white);color:var(--text2);padding:5px 12px;font-size:13px;font-variant-numeric:tabular-nums}
.rg button+button{border-left:1px solid var(--border2)}
.rg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.trt{display:flex;gap:10px;flex-wrap:wrap}

.body{display:grid;grid-template-columns:185px minmax(0,1fr);gap:16px}
@media (max-width:820px){.body{grid-template-columns:1fr}.hero,.filters{padding-left:16px;padding-right:16px}.main{padding:0 16px 16px}}
.tree{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.node{position:relative;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:6px;border-left:3px solid transparent;color:var(--text2);cursor:pointer;overflow:visible}
.node.on{background:var(--brand-bg);color:var(--brand-dark);font-weight:600;border-left-color:var(--brand)}
.node .lab{font-size:15px;display:flex;align-items:center;gap:6px}
.node .ok{color:var(--ok);font-size:12px;font-weight:600}
.node .r{display:flex;align-items:center;gap:4px}
.badge{border-radius:10px;padding:2px 8px;font-size:11px;line-height:12px;background:var(--brand);color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.badge.pend{background:var(--warn-bg);color:var(--warn)}
.more{border:0;background:none;color:var(--muted);width:20px;height:20px;border-radius:4px;font-size:14px;line-height:1;padding:0}
.more:hover{background:#ebeef5}
.np{position:absolute;left:12px;right:12px;bottom:3px;height:2px;background:#ebeef5;border-radius:1px;overflow:hidden}
.np i{display:block;height:100%;background:var(--ok)}
.dd{position:absolute;z-index:30;top:100%;right:0;margin-top:4px;min-width:200px;background:#fff;border:1px solid var(--border);border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.1);padding:6px 0;font-weight:400;color:var(--text2);cursor:default}
.dd .it{display:flex;justify-content:space-between;align-items:center;padding:0 16px;line-height:36px;font-size:14px;width:100%;border:0;background:none;text-align:left;color:var(--text2)}
.dd .it:hover{background:var(--brand-bg);color:var(--brand)}
.dd hr{border:0;border-top:1px solid #ebeef5;margin:6px 0}
.dd .cf{padding:8px 16px;display:flex;flex-direction:column;gap:8px;font-size:13px;max-width:260px}
.dd .cf div{display:flex;gap:8px;justify-content:flex-end}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;align-content:start}
.card{position:relative;border:1px solid var(--border);border-radius:8px;background:var(--white);padding:12px;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s,opacity .2s}
.card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card.sel{border-color:var(--brand);background:var(--brand-bg2)}
.card.leaving{opacity:.2}
.img{position:relative;background:#fdfdfb;border:1px solid #b9bec5;padding:6px 8px 4px;color:#3a3a3a;font-size:10.5px;line-height:1.85;cursor:zoom-in;user-select:none;overflow:hidden}
.img .hd{font-size:9px;color:#888}
.img .ln{white-space:nowrap;overflow:hidden}
.h{font-family:var(--hand);font-size:17px;color:var(--ink);display:inline-block;min-width:11px;text-align:center;border-bottom:1px solid #777;line-height:1;margin:0 1px;transform:rotate(var(--rot,0deg))}
.eye{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.18);color:#fff;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none}
.img:hover .eye{opacity:1}
.batch .img{cursor:pointer}.batch .eye{display:none}
.qc{position:absolute;top:18px;right:18px;z-index:2;border:1px solid var(--ok);background:#fff;color:var(--ok);border-radius:14px;padding:2px 10px;font-size:12px;opacity:0;transition:opacity .12s;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card:hover .qc{opacity:1}
.qc:hover{background:var(--ok);color:#fff}
.tb{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tags{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0}
.nm{background:var(--brand-bg2);color:var(--brand-dark);padding:2px 6px;border-radius:4px;font-weight:550;font-size:13px;white-space:nowrap}
.tag{padding:2px 6px;border-radius:4px;font-size:12px;font-weight:600;white-space:nowrap;border:0}
.tag.rev{background:var(--ok-bg);color:var(--ok)}
button.tag.rev:hover{background:#d5eedf}
.tag.cor{background:var(--warn-bg);color:var(--warn)}
.tag.low{background:var(--red-bg);color:var(--red);font-weight:500}
.ck{width:16px;height:16px;border:1px solid var(--border2);border-radius:2px;background:#fff;display:inline-grid;place-items:center;color:#fff;font-size:11px;flex:none}
.card.sel .ck{background:var(--brand);border-color:var(--brand)}
.step{display:flex;align-items:center;border:1.5px solid var(--border2);border-radius:6px;padding:1px 2px;min-height:26px}
.step button{border:0;background:none;width:24px;height:24px;color:var(--text2);border-radius:4px;font-size:15px;line-height:1}
.step button:hover{background:#f2f3f5}
.step span{min-width:44px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.step small{font-weight:400;font-size:12px;color:var(--muted);margin-left:1px}
.batch .step{opacity:.5;pointer-events:none}
.empty{grid-column:1/-1;text-align:center;padding:56px 12px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ok);font-size:16px}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-variant-numeric:tabular-nums;color:var(--text2);font-size:13px;flex-wrap:wrap;margin-top:20px}
.pager button{border:1px solid var(--border2);background:#fff;border-radius:4px;min-width:30px;height:28px;color:var(--text2)}
.pager button[aria-current="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}

/* 底部条：沿用 batch-score-bar 的形态 */
.bbar{position:sticky;bottom:0;z-index:16;margin-top:16px;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 -4px 16px rgba(0,0,0,.06);min-height:56px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.bbar .l{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--text2);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.bbar .l b{color:var(--text)}
.bbar .rr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chkl{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:0;background:none;color:var(--text2);padding:0}
kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:6px;opacity:.8}
.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:60;background:#f0f9eb;border:1px solid #e1f3d8;color:#67c23a;border-radius:4px;padding:10px 16px;display:flex;gap:16px;align-items:center;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.1);max-width:calc(100vw - 32px)}
.toast button{border:0;background:none;color:var(--brand);font-weight:600;padding:0}

/* 学生作答详情弹窗（现有 80vw 布局，右侧新增审核区） */
.mask{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:16px 72px}
@media (max-width:820px){.mask{padding:16px}}
.modal{position:relative;background:#fff;border-radius:8px;width:min(80vw,1200px);max-height:100%;display:flex;flex-direction:column}
@media (max-width:820px){.modal{width:100%}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid #ebeef5;font-size:16px;font-weight:600}
.mh button{border:0;background:none;font-size:20px;color:var(--muted)}
.mb{padding:20px 24px;overflow:auto;display:flex;gap:24px}
@media (max-width:820px){.mb{flex-direction:column}}
.ml{flex:1.2;display:flex;flex-direction:column;gap:16px;min-width:0}
.ml .img{font-size:15px;line-height:2;cursor:default;padding:12px 16px}
.ml .img .h{font-size:26px;min-width:16px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec>span{font-size:13px;color:var(--muted);font-weight:600}
.box{padding:12px;background:#f8f9fa;border:1px solid #e8e8e8;border-radius:6px;font-size:13px;color:var(--text2);line-height:1.6}
.vr{width:1px;background:#e8e8e8}
@media (max-width:820px){.vr{display:none}}
.mr{flex:.8;display:flex;flex-direction:column;gap:16px;min-width:280px}
@media (max-width:820px){.mr{min-width:0}}
.se{padding:16px;background:#fafafa;border:1px solid #e8e8e8;border-radius:8px;display:flex;flex-direction:column;gap:10px}
.se .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted)}
.se input{width:130px;height:40px;border:1px solid var(--border2);border-radius:4px;padding:0 12px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--text)}
.se input:focus{outline:0;border-color:var(--brand)}
.rvbox{padding:14px 16px;border:1px solid #b3e4e5;background:var(--brand-bg2);border-radius:8px;display:flex;flex-direction:column;gap:10px}
.rvbox .row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--text2)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2);font-size:18px;color:var(--text2)}
.nav.l{left:-60px}.nav.r{right:-60px}
@media (max-width:820px){.nav{display:none}}

/* 设计说明 */
.doc{background:#fff;border-radius:10px;padding:24px clamp(16px,4vw,40px);display:flex;flex-direction:column;gap:22px}
.doc h2{margin:0;font-size:20px}
.doc h3{margin:0 0 8px;font-size:16px;color:var(--brand-dark)}
.doc p,.doc li{max-width:76ch}
.doc p{margin:0 0 8px}
.doc ul,.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.doc .muted{color:var(--muted)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:600px;width:100%;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
.tbl th{background:#f5f7fa;font-weight:600}
code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#f5f7fa;padding:1px 5px;border-radius:4px}
pre{background:#f5f7fa;border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&display=swap">
</head>
<body>
<div class="wrap" id="wrap">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-proto" aria-selected="true">交互原型</button>
    <button role="tab" id="tab-doc" aria-selected="false">设计说明</button>
  </div>

  <div id="view-proto" style="display:flex;flex-direction:column;gap:16px">
    <div class="legend">
      <span><i></i>虚线框 = 本次新增的元素，其余为现有页面</span>
      <label style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="legendToggle" checked> 显示新增标记</label>
      <span>快捷操作：Enter 确认本页 · 详情弹窗里 Enter 通过并下一份、← → 翻看</span>
    </div>

    <div class="top">
      <div class="hero">
        <div class="t"><span class="ico">▤</span>智能批改</div>
        <button class="btn">设置智能批改</button>
      </div>
      <div class="filters">
        <div class="frow"><span class="lb">班级</span></div>
        <div class="frow" style="flex:1;min-width:0"><span class="lb">题号</span><span class="gl">解答题：</span><span id="qnList" style="display:flex;gap:6px;flex-wrap:wrap"></span></div>
        <div class="tr-btns">
          <button class="ebtn">▮▮▮ 进度总览</button>
          <button class="ebtn">⟳ 题型转换</button>
          <div class="swrow isnew" title="关闭后本题不显示审核进度与操作；改分仍记为已修正"><span>本题需要审核</span><button class="sw" id="reviewToggle" role="switch" aria-checked="true" aria-label="本题需要审核"></button></div>
        </div>
      </div>
    </div>

    <div class="main" id="panel">
      <div class="toolbar" id="toolbar">
        <div class="tl">
          <span class="finish">批改完成 ⌄ <button class="refresh">↻ 刷新</button></span>
          <span class="rv isnew" id="rv"></span>
          <span class="rg isnew" id="rg" role="group" aria-label="审核筛选"></span>
        </div>
        <div class="trt" id="trt"></div>
      </div>
      <div class="body">
        <ul class="tree" id="tree"></ul>
        <div style="min-width:0">
          <div class="grid" id="grid"></div>
          <div class="pager" id="pager"></div>
          <div class="bbar" id="bbar"></div>
        </div>
      </div>
    </div>
  </div>

  <section class="doc" id="view-doc" hidden></section>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div class="mask" id="mask" hidden></div>

<template id="docTpl">
  <h2>智能批改审核：基本设计</h2>
  <p class="muted">原型数据为模拟数据，学生姓名随机生成：第 13 题（配平题，4 小问各 4 分，满分 16），72 名学生，其中少量 AI 判分有误。每页 12 份，便于演示翻页。</p>

  <div>
    <h3>1. 老师实际怎么审</h3>
    <ol>
      <li><b>扫页找错（最主要）</b>：一页 8–20 张卡片快速扫过，只在发现判错时动手改分，其余默认认可。真正的成本在“看”，不在“点”。</li>
      <li><b>重点件细看</b>：低置信、分数在中间段、作文/长解答，需要放大逐份看。</li>
      <li><b>整组放行</b>：满分组、OCR 答案完全一致的组，抽几份没问题就整组放行。</li>
      <li><b>分次、多人完成</b>：课间审一点、明天接着审；同一题可能由备课组几位老师分担。这正是“忘了审到哪”的根源。</li>
    </ol>
  </div>

  <div>
    <h3>2. 核心思路：把审核做成“清空待办”</h3>
    <ul>

      <li><b>只处理例外</b>：看到判错的直接改分，改分即视为已审（已修正）；其余的用一次“确认本页其余 N 份”放行。一页的成本 = 改错的几张 + 1 次点击。</li>
      <li><b>风险优先</b>：页内按低置信在前排序（现有逻辑），分组上显示每组的待审数，老师自然先去有风险的地方。</li>
      <li><b>任何批量操作都可撤销</b>（底部提示条 8 秒内“撤销”），因此批量按钮不需要二次确认弹窗；只有整组确认（可能几百份）用一个轻量内联确认。</li>

    items().forEach(function(s){ (groups[s.group] = groups[s.group] || []).push(s); });
    var keys = Object.keys(groups).map(Number).sort(function(a,b){ return b - a; });
    var th = '<li><div class="node' + (S.group === "all" ? ' on' : '') + '" data-act="group" data-g="all"><span class="lab">全部</span><span class="badge">' + st.total + '份</span></div></li>';
    keys.forEach(function(k){
      var gs = stats(groups[k]), done = gs.total - gs.pending;
      th += '<li><div class="node' + (S.group === k ? ' on' : '') + '" data-act="group" data-g="' + k + '">' +
        '<span class="lab">' + k + (on() && !gs.pending ? '<span class="ok isnew" title="本组已审完">✓</span>' : '') + '</span>' +
        '<span class="r"><span class="badge" title="' + (on() ? '待审 ' + gs.pending : '') + '">' + gs.total + '份</span>' +
        (S.batch ? '' : '<button class="more" data-act="menu" data-g="' + k + '" aria-label="' + k + '分组操作">⋮</button>') + '</span>' +
        (on() && gs.pending && done ? '<span class="np isnew"><i style="width:' + (done/gs.total*100) + '%"></i></span>' : '') +
        (S.menu === k ? menu(k, gs) : '') + '</div></li>';
    });
    $("tree").innerHTML = th;

    var list = pageItems(), all = filtered();
    var maxPage = Math.max(1, Math.ceil(all.length / PAGE));
    if (S.page > maxPage) { S.page = maxPage; list = pageItems(); }
    $("grid").className = "grid" + (S.batch ? " batch" : "");
    if (!list.length) {
      $("grid").innerHTML = on() && S.filter === "pending"
        ? '<div class="empty isnew"><strong>✓ ' + (S.group === "all" ? "本题" : S.group + " 分组") + '已全部审核</strong><span>共 ' + st.total + ' 份，其中修正 ' + st.corrected + ' 份。可切到“已审核”复查。</span>' + nextQn() + '</div>'
        : '<div class="empty">暂无数据</div>';
    } else {
      $("grid").innerHTML = list.map(function(s){
        var sel = S.selAll || !!S.sel[s.id];
        return '<div class="card' + (sel && S.batch ? ' sel' : '') + '" data-id="' + s.id + '">' +
          '<div class="img" data-act="' + (S.batch ? 'pick' : 'detail') + '" data-id="' + s.id + '">' + sheet(s) + '<span class="eye">👁 查看详情</span></div>' +
          (on() && !S.batch && s.st === "pending" ? '<button class="qc isnew" data-act="review1" data-id="' + s.id + '" title="确认这份判分无误">✓ 确认</button>' : '') +
          '<div class="tb"><div class="tags">' + (S.batch ? '<span class="ck" data-act="pick" data-id="' + s.id + '">' + (sel ? '✓' : '') + '</span>' : '') +
          '<span class="nm">' + esc(s.name) + '</span>' + reviewTag(s) + (s.low && on() && s.st === "pending" ? '<span class="tag low isnew">低置信</span>' : '') + '</div>' +
          '<div class="step"><button data-act="dec" data-id="' + s.id + '" aria-label="减分">−</button><span>' + s.score + '<small>分</small></span><button data-act="inc" data-id="' + s.id + '" aria-label="加分">+</button></div></div></div>';
      }).join("");
    }
    var ph = '';
    if (all.length) {
      ph += '<span>共 ' + all.length + ' 条</span>';
      for (var p = 1; p <= maxPage; p++) ph += '<button data-act="page" data-p="' + p + '" aria-current="' + (p === S.page) + '">' + p + '</button>';
      ph += '<span>' + PAGE + '条/页</span>';
    }
    $("pager").innerHTML = ph;
    renderBar(list, all);
    if (S.detail) renderDetail();
  }
  function nextQn(){
    var nq = [13,14,15].filter(function(q){ return q !== S.qn && S.on[q] && stats(Q[q]).pending; })[0];
    return nq ? '<button class="ebtn primary" data-act="qn" data-q="' + nq + '">去第 ' + nq + ' 题（待审 ' + stats(Q[nq]).pending + '）</button>' : '';
  }
  function menu(k, gs){
    var h = '<div class="dd" data-stop="1">' +
      '<button class="it">将分数调整为 <span>›</span></button><button class="it">设为人工阅卷</button>';
    if (on()) {
      h += '<hr>';
      if (!S.menuConfirm) h += '<button class="it isnew" data-act="groupAsk" ' + (gs.pending ? '' : 'disabled style="opacity:.5"') + '>确认本组待审核（' + gs.pending + '份）</button>';
      else h += '<div class="cf isnew"><span>将 ' + k + ' 分组 <b>' + gs.pending + '</b> 份待审核全部标为已审核。建议先抽看几份，可撤销。</span><div><button class="ebtn" data-act="menuClose">取消</button><button class="ebtn primary" data-act="groupConfirm" data-g="' + k + '">确认</button></div></div>';
    }
    return h + '</div>';
  }
  function renderBar(list, all){
    var b = $("bbar"), selIds = selectedIds();
    if (S.batch) {
      var pageAll = list.length && list.every(function(s){ return S.selAll || S.sel[s.id]; });
      var head = '<div class="l"><button class="chkl" data-act="selPage"><span class="ck" style="' + (pageAll ? 'background:var(--brand);border-color:var(--brand)' : '') + '">' + (pageAll ? '✓' : '') + '</span>当前页</button>' +
        '<button class="chkl" data-act="selAllPaged"><span class="ck" style="' + (S.selAll ? 'background:var(--brand);border-color:var(--brand)' : '') + '">' + (S.selAll ? '✓' : '') + '</span>全部</button>' +
        '<span>(' + selIds.length + '/' + all.length + ')</span></div>';
      var acts = S.batch === 1 ? '<button class="ebtn red" data-act="bset" data-v="0">设为0分</button><button class="ebtn" data-act="bset" data-v="' + MAX + '">设为满分</button>'
        : S.batch === 2 ? '<button class="ebtn isnew" data-act="bpending">设为待审核</button><button class="ebtn primary isnew" data-act="breview">标记已审核</button>'
        : '<span style="color:var(--text2);font-size:13px">识别不准确，是需要交给阅卷老师批改吗？</span><button class="ebtn primary" data-act="bexit">确定</button>';
      b.className = "bbar" + (S.batch === 2 ? " isnew" : "");
      b.innerHTML = head + '<div class="rr">' + acts + '<button class="ebtn text" data-act="bexit">✕ 退出批量</button></div>';
      b.hidden = false; return;
    }
    if (!on() || !list.length) { b.hidden = true; return; }
    var ps = stats(list);
    b.className = "bbar isnew";
    b.hidden = false;
    b.innerHTML = '<div class="l"><span>当前页 <b>' + list.length + '</b> 份：待审 <b>' + ps.pending + '</b> · 已审 ' + ps.reviewed + ' · 已修正 ' + ps.corrected + '</span><span style="color:var(--muted)">判错的直接改分，改分即视为已审</span></div>' +
      '<div class="rr">' + (ps.pending ? '<button class="ebtn primary" data-act="pageConfirm">确认本页' + (ps.reviewed || ps.corrected ? '其余 ' : ' ') + ps.pending + ' 份无误' + (S.filter === "pending" ? '，看下一批' : '') + '<kbd>Enter</kbd></button>' : '<span style="color:var(--ok)">✓ 本页已全部审核</span>') + '</div>';
  }
  function selectedIds(){ return S.selAll ? filtered().map(function(s){ return s.id; }) : Object.keys(S.sel).map(Number); }

  function apply(list, st, msg){
    var snap = list.filter(function(s){ return s.st !== "corrected" && s.st !== st; }).map(function(s){ return [s, s.st]; });
    if (!snap.length) return;
    snap.forEach(function(x){ x[0].st = st; S.keep[x[0].id] = true; });
    S.undo = snap; toast(msg.replace("{n}", snap.length), true);
  }
  var tt = null;
  function toast(msg, undo){
    var t = $("toast");
    t.innerHTML = '<span>' + msg + '</span>' + (undo ? '<button data-act="undo">撤销</button>' : '');
    t.hidden = false; clearTimeout(tt);
    tt = setTimeout(function(){ t.hidden = true; S.undo = null; }, 8000);
  }
  function setScore(s, v){
    v = Math.max(0, Math.min(MAX, v));
    if (isNaN(v) || v === s.score) return;
    s.score = v; s.st = v === s.ai ? "reviewed" : "corrected"; S.keep[s.id] = true;
  }
  function exitBatch(){ S.batch = 0; S.sel = {}; S.selAll = false; }
  function pageConfirm(){
    var list = pageItems().filter(function(s){ return s.st === "pending"; });
    if (!list.length) return;
    list.forEach(function(s){ var e = document.querySelector('.card[data-id="' + s.id + '"]'); if (e) e.classList.add("leaving"); });
    setTimeout(function(){
      apply(list, "reviewed", "已确认本页 {n} 份");
      S.keep = {};
      if (S.filter !== "pending") S.page = Math.min(S.page + 1, Math.max(1, Math.ceil(filtered().length / PAGE)));
      render(); window.scrollTo({top: $("panel").offsetTop, behavior: "smooth"});
    }, 180);
  }

  // 详情弹窗
  function openDetail(id){ S.detail = {list: filtered().map(function(s){ return s.id; }), id: Number(id)}; $("mask").hidden = false; renderDetail(); }
  function closeDetail(){ S.detail = null; S.keep = {}; $("mask").hidden = true; render(); }
  function navDetail(d){ var l = S.detail.list, i = l.indexOf(S.detail.id) + d; if (i >= 0 && i < l.length) { S.detail.id = l[i]; renderDetail(); } }
  function passDetail(){
    var s = find(S.detail.id);
    if (s.st === "pending") s.st = "reviewed";
    var l = S.detail.list, i = l.indexOf(s.id);
    // 跳到下一份待审核；没有则停在当前
    for (var j = i + 1; j < l.length; j++) { if (find(l[j]).st === "pending") { S.detail.id = l[j]; render(); return; } }
    closeDetail(); toast("当前筛选下已没有待审核的卷子", false);
  }
  function renderDetail(){
    var s = find(S.detail.id), l = S.detail.list, i = l.indexOf(s.id);
    var reason = LINES.map(function(L, k){ var ok = s.ans[k].join() === L.k.join(); return '(' + (k+1) + ') ' + L.n + '：' + (ok ? '配平正确，得 4 分' : '系数有误，不得分'); }).join('<br>');
    var stTxt = s.st === "corrected" ? '<span class="tag cor">已修正 ' + s.ai + '→' + s.score + '</span>' : s.st === "reviewed" ? '<span class="tag rev">✓ 已审 · 张老师</span>' : '<span class="tag" style="background:#f4f4f5;color:var(--muted)">待审核</span>';
    $("mask").innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="学生作答详情" data-stop="1">' +
      '<button class="nav l" data-act="dprev" aria-label="上一份">‹</button><button class="nav r" data-act="dnext" aria-label="下一份">›</button>' +
      '<div class="mh"><span>' + esc(s.name) + ' 的作答 <span style="color:var(--muted);font-weight:400;font-size:13px">（' + (i+1) + '/' + l.length + '）</span></span><button data-act="dclose" aria-label="关闭">×</button></div>' +
      '<div class="mb"><div class="ml"><div class="img">' + sheet(s) + '</div>' +
      '<div class="sec"><span>识别结果:</span><div class="box">' + s.ans.map(function(a, k){ return '(' + (k+1) + ') ' + a.join(', '); }).join('；') + '</div></div></div>' +
      '<div class="vr"></div><div class="mr">' +
      '<div class="se"><span style="font-size:13px;color:var(--text2);font-weight:600">得分修改:</span><div class="row"><input id="dscore" type="number" min="0" max="' + MAX + '" step="1" value="' + s.score + '"><span>分 / 满分 ' + MAX + ' 分</span></div></div>' +
      (on() ? '<div class="rvbox isnew"><div class="row"><span>审核状态 ' + stTxt + '</span>' + (s.low ? '<span class="tag low">低置信 ' + Math.round(s.conf*100) + '%</span>' : '') + '</div>' +
        '<div class="row"><span style="color:var(--muted)">改分会自动记为已修正</span><button class="ebtn primary" data-act="dpass">' + (s.st === "pending" ? '通过并下一份' : '下一份待审') + '<kbd>Enter</kbd></button></div></div>' : '') +
      '<div class="sec" style="flex:1"><span>评分理由:</span><div class="box" style="background:#fff">' + reason + '</div><div style="font-size:12px;color:var(--muted);text-align:center">【内容由AI根据评分标准生成】</div></div>' +
      '</div></div></div>';
    var inp = $("dscore");
    inp.addEventListener("change", function(){ setScore(s, Number(inp.value)); render(); });
  }

  var RESET_KEEP = {qn:1, filter:1, group:1, page:1}, CLEAR_AFTER = {groupConfirm:1, breview:1, bpending:1, bset:1};
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-act]");
    if (S.menu !== null && !e.target.closest("[data-stop]") && !(el && el.dataset.act === "menu")) { S.menu = null; S.menuConfirm = false; if (!el) { render(); return; } }
    if (!el) { if (e.target === $("mask")) return; return; }
    var stop = e.target.closest("[data-stop]");
    if (stop && !stop.contains(el)) return;
    var a = el.dataset.act, id = el.dataset.id, s;
    if (RESET_KEEP[a]) S.keep = {};
    switch (a) {
      case "qn": S.qn = Number(el.dataset.q); S.group = "all"; S.page = 1; exitBatch(); S.filter = S.on[S.qn] ? "pending" : "all"; break;
      case "filter": S.filter = el.dataset.f; S.page = 1; S.sel = {}; S.selAll = false; break;
      case "group": S.group = el.dataset.g === "all" ? "all" : Number(el.dataset.g); S.page = 1; S.sel = {}; S.selAll = false; break;
      case "menu": e.stopPropagation(); S.menuConfirm = false; S.menu = S.menu === Number(el.dataset.g) ? null : Number(el.dataset.g); break;
      case "groupAsk": S.menuConfirm = true; break;
      case "menuClose": S.menu = null; S.menuConfirm = false; break;
      case "groupConfirm": var g = Number(el.dataset.g); apply(items().filter(function(x){ return x.group === g && x.st === "pending"; }), "reviewed", g + " 分组已确认 {n} 份"); S.menu = null; S.menuConfirm = false; break;
      case "page": S.page = Number(el.dataset.p); window.scrollTo({top: $("panel").offsetTop}); break;
      case "review1": apply([find(id)], "reviewed", "已确认 1 份"); break;
      case "unreview": apply([find(id)], "pending", "已撤回为待审核"); break;
      case "inc": s = find(id); setScore(s, s.score + 1); break;
      case "dec": s = find(id); setScore(s, s.score - 1); break;
      case "detail": openDetail(id); return;
      case "batch": S.batch = Number(el.dataset.t); S.sel = {}; S.selAll = false; break;
      case "bexit": exitBatch(); break;
      case "pick": if (S.selAll) break; if (S.sel[id]) delete S.sel[id]; else S.sel[id] = true; break;
      case "selPage": var pl = pageItems(), allOn = pl.every(function(x){ return S.sel[x.id]; }); S.selAll = false; pl.forEach(function(x){ if (allOn) delete S.sel[x.id]; else S.sel[x.id] = true; }); break;
      case "selAllPaged": S.selAll = !S.selAll; S.sel = {}; break;
      case "breview": apply(selectedIds().map(find), "reviewed", "已标记 {n} 份为已审核"); exitBatch(); break;
      case "bpending": apply(selectedIds().map(find), "pending", "{n} 份已设为待审核"); exitBatch(); break;
      case "bset": var v = Number(el.dataset.v), n = 0; selectedIds().map(find).forEach(function(x){ var before = x.score; setScore(x, v); if (x.score !== before) n++; }); exitBatch(); toast("已修改 " + n + " 份分数，均记为已修正", false); break;
      case "pageConfirm": pageConfirm(); return;
      case "undo": if (S.undo) { S.undo.forEach(function(x){ x[0].st = x[1]; }); S.undo = null; $("toast").hidden = true; } break;
      case "dclose": closeDetail(); return;
      case "dprev": navDetail(-1); return;
      case "dnext": navDetail(1); return;
      case "dpass": passDetail(); return;
      default: return;
    }
    if (CLEAR_AFTER[a]) S.keep = {};
    render();
  });
  $("reviewToggle").addEventListener("click", function(){ S.keep = {}; S.on[S.qn] = !S.on[S.qn]; S.filter = S.on[S.qn] ? "pending" : "all"; S.page = 1; exitBatch(); render(); });
  $("legendToggle").addEventListener("change", function(e){ $("wrap").classList.toggle("legend-off", !e.target.checked); });
  document.addEventListener("keydown", function(e){
    if (S.detail) {
      if (e.target.id === "dscore" && e.key !== "Enter") return;
      if (e.key === "Enter" && on()) { e.preventDefault(); if (e.target.id === "dscore") { setScore(find(S.detail.id), Number(e.target.value)); } passDetail(); }
      else if (e.key === "ArrowLeft") navDetail(-1);
      else if (e.key === "ArrowRight") navDetail(1);
      return;
    }
    if (e.target.matches("input,textarea,button")) return;
    if (e.key === "Enter" && on() && !S.batch && !$("view-proto").hidden) { e.preventDefault(); pageConfirm(); }
    if (e.key === "Escape" && S.batch) { exitBatch(); render(); }
  });
  window.addEventListener("scroll", function(){ var t = $("toolbar"); t.classList.toggle("stuck", t.getBoundingClientRect().top <= 0); }, {passive: true});

  $("view-doc").appendChild($("docTpl").content.cloneNode(true));
  function showTab(doc){
    $("tab-proto").setAttribute("aria-selected", !doc); $("tab-doc").setAttribute("aria-selected", doc);
    $("view-proto").hidden = doc; $("view-doc").hidden = !doc; render();
  }
  $("tab-proto").addEventListener("click", function(){ showTab(false); });
  $("tab-doc").addEventListener("click", function(){ showTab(true); });
  showTab(location.hash === "#design");
})();
</script>
</body>
</html>
